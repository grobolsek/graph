[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["one_layer_insulation_pipeline"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"one_layer_insulation_pipeline" = ["py.typed"]

[project]
name = "one_layer_insulation_pipeline"
version = "0.1.0"
authors = [
    {name = "Matic Grobolšek"},
]
dependencies = [
    "pandas>=2.3.3",
    "python-calamine>=0.6.1",
    "pyarrow>=22.0.0",
    "azure-storage-file-datalake>=12.22.0",
    "azure-identity>=1.25.1"
]
requires-python = ">=3.12.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "mypy>=1.9.0",
    "ruff>=0.3.5",
    "pre-commit>=3.7.0",
    "pre-commit-hooks>=4.6.0"
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = ["S301", "D104", "G004", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["S101", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
